<!doctype html><link rel="stylesheet" href="/tl_style.css"><style>body{margin:0;background:#1e2235;color:#ddd;font:16px Arial;--SmartThemeBlurTintColor:#1e2235;--SmartThemeBodyColor:#ddd;--SmartThemeBorderColor:#454d68;--SmartThemeQuoteColor:#e2bb86}button{color:inherit;background:transparent;border:1px solid #454d68}#sheld{width:700px;position:absolute;left:290px;height:850px}</style><div id="sheld"></div><div id="tlpDock"><div id="tlpRoot"></div></div><div id="networkContainer" style="display:none"></div><script type="module">
 import {mountTimeline} from '/tl_view.js';
 const chain=(n,p)=>Array.from({length:n},(_,i)=>({mes:p+i+' '+('A readable example message. '.repeat(100)),name:i%2?'You':'Character',is_user:!!(i%2)}));
 const chats={'main.jsonl':chain(35,'shared')};const metas={};for(let i=0;i<4;i++){chats['branch'+i+'.jsonl']=chats['main.jsonl'].slice(0,5+i*5).concat(chain(10,'branch'+i));metas['branch'+i+'.jsonl']={mainChat:'main'};}
 const root=document.querySelector('#tlpRoot');
 window.view=mountTimeline(root,{onPopout(){document.querySelector('#tlpDock').hidden=true;const shell=document.querySelector('#networkContainer');shell.style.display='flex';shell.append(root);view.update({popped:true});},onDock(){document.querySelector('#networkContainer').style.display='none';document.querySelector('#tlpDock').hidden=false;document.querySelector('#tlpDock').append(root);view.update({popped:false});}});
 view.update({chats,metas,activeFile:'main.jsonl',activeDepth:34,charAvatar:'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32"><rect width="32" height="32" fill="tan"/></svg>'});</script>
