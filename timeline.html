<div class="timeline-view-settings">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b>Timelines</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">
            <div class="timeline-view-settings_block">
                <small>Opens a top-down tree of this character's chats. Shared messages stay one row. Graph draws the branch you ask for, from the message number, without laying out the whole archive.</small>
            </div>
            <div class="timeline-view-settings_block flex-container">
                <input id="show_timeline_view" class="menu_button" type="submit" value="Show Timeline" title="Open the timeline. Same as /tl. /tl r reloads every chat file." />
            </div>
            <div class="timelines-modal-storage hidden">
                <div id="timelinesModal" class="modal">
                    <div id="networkContainer">
                        <div id="tlpRoot" class="tlp-root"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
